name: 功能建议
description: 提议一个符合本地优先和模块边界的新能力。
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 请描述使用场景，而不只是指定实现方式。
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: textarea
    id: data
    attributes:
      label: 数据与权限影响
      description: 是否需要新 store、迁移、网络请求或浏览器权限？
    validations:
      required: true
  - type: checkboxes
    id: boundaries
    attributes:
      label: 边界确认
      options:
        - label: 该建议不会要求提交个人备份或密钥。
          required: true
